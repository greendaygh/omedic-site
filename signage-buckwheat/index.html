</p> </div> </div> </footer> </div> </section> <script>
    (() => {
      const video = document.getElementById('signage-video');
      if (!video) return;

      const portrait = window.matchMedia('(orientation: portrait)');

      const apply = () => {
        const src = portrait.matches
          ? video.dataset.srcPortrait
          : video.dataset.srcLandscape;
        if (!src) return;
        const current = video.currentSrc || video.getAttribute('src') || '';
        if (current.endsWith(src)) return;
        video.setAttribute('src', src);
        video.load();
        const played = video.play();
        if (played && typeof played.catch === 'function') played.catch(() => {});
      };

      apply();

      if (typeof portrait.addEventListener === 'function') {
        portrait.addEventListener('change', apply);
      } else if (typeof portrait.addListener === 'function') {
        portrait.addListener(apply);
      }
    })();
  </script>  </main>   </body></html>
